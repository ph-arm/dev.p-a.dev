---
layout: default
---

<div class="content">
  {% include pagination-newer.html %}

  {{ content }}

  <div id="post-list">
    {% for post in paginator.posts %}
    <article class="post-body">
      <h2 class="post-title">
        <a href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      </h2>
      {% include post-meta.html post=post %}

      {{ post.content }}
    </article>
    {% endfor %}
  </div>

  {% include pagination-older.html %}
</div>
