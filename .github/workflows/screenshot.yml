name: Weekly site screenshot

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture screenshot
        env:
          SITE_URL: "https://p-a.dev"
        run: node .github/scripts/screenshot.mjs

      - name: Commit screenshot (signed by GitHub)
        env:
          GH_TOKEN: ${{ secrets.SCREENSHOT_PAT }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: screenshots
        run: .github/scripts/commit-screenshot.sh
